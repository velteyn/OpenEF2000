name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Artifacts are per-run and cannot be overwritten in place, so each push to
  # main removes the copies from older runs. The run-id filter keeps a
  # concurrently uploading build from deleting its own output.
  cleanup:
    name: Replace previous artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Delete artifacts from older runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          for name in openef2000-linux-x86_64 openef2000-windows-x86_64; do
            gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.name == \"$name\" and (.workflow_run.id|tostring) != \"$RUN\") | .id" |
            while read -r id; do
              [ -n "$id" ] || continue
              gh api -X DELETE "repos/$REPO/actions/artifacts/$id" >/dev/null &&
                echo "deleted $name ($id)"
            done
          done

  build:
    name: Build and guard
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake pkg-config \
            libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev

      # The repository is published on the promise that it holds no game
      # assets, no binaries and no decompiled material. Enforce it in CI so a
      # bad commit cannot land by accident.
      - name: Guard the public tree
        run: ./scripts/check-public-tree.sh

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: GUI runtime self-test
        run: ./build/openef2000 --gui-selftest

      - name: Smoke test
        run: |
          ./build/openef2000 --help
          # The engine must fail cleanly, not crash, when no game data is present.
          ./build/openef2000 --data ./does-not-exist --stats || true

      - name: Package
        run: |
          mkdir -p dist
          cp build/openef2000 dist/

      - name: Upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: openef2000-linux-x86_64
          path: dist/
          retention-days: 7

  windows:
    name: Build (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Standard GitHub-hosted runners are free for public repositories, so
      # this job costs nothing beyond CI time.
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-SDL2_image

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: GUI runtime self-test
        run: ./build/openef2000.exe --gui-selftest

      - name: Smoke test
        run: |
          ./build/openef2000.exe --help
          # The engine must fail cleanly, not crash, when no game data is present.
          ./build/openef2000.exe --data ./does-not-exist --stats || true

      # Windows needs the MinGW and SDL2 DLLs next to the executable. Pull the
      # resolved imports from ldd, then top up the codecs SDL2_image loads at
      # run time. MSYS2 now ships SDL2 as sdl2-compat, a shim that loads
      # SDL3.dll at run time; that dependency is invisible to ldd, so name it
      # explicitly. The closure loop then picks up anything the new DLLs need.
      - name: Package
        run: |
          mkdir -p dist
          cp build/openef2000.exe dist/
          for dll in $(ldd build/openef2000.exe | awk '/mingw64\/bin/ {print $3}'); do
            cp "$dll" dist/ 2>/dev/null || true
          done
          for dll in SDL3.dll SDL2.dll SDL2_ttf.dll SDL2_image.dll \
                     libpng16-16.dll libjpeg-8.dll libtiff-5.dll libwebp-7.dll \
                     libwebpdemux-2.dll libwebpmux-3.dll zlib1.dll \
                     libfreetype-6.dll libharfbuzz-0.dll libgraphite2.dll \
                     libbz2-1.dll liblzma-5.dll libzstd-1.dll libbrotlidec.dll \
                     libbrotlicommon.dll libdeflate.dll libjbig-0.dll libLerc.dll \
                     libsharpyuv-0.dll libgcc_s_seh-1.dll libstdc++-6.dll \
                     libwinpthread-1.dll; do
            cp "/mingw64/bin/$dll" dist/ 2>/dev/null || true
          done
          # Transitive closure, twice, so a dependency of a dependency lands.
          for pass in 1 2; do
            for dll in dist/*.dll; do
              for dep in $(ldd "$dll" | awk '/mingw64\/bin/ {print $3}'); do
                [ -f "dist/$(basename "$dep")" ] || cp "$dep" dist/ 2>/dev/null || true
              done
            done
          done
          ls -l dist

      # The runner's PATH contains /mingw64/bin, which would hide a missing
      # DLL. Run the package with only the system directories on PATH: the
      # executable's own directory is searched first, so this proves the zip
      # is self-contained (the sdl2-compat/SDL3 case broke exactly here).
      - name: Verify the package is self-contained
        run: |
          cd dist
          PATH="/c/Windows/System32:/c/Windows" ./openef2000.exe --help > /dev/null
          PATH="/c/Windows/System32:/c/Windows" ./openef2000.exe --gui-selftest

      - name: Upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: openef2000-windows-x86_64
          path: dist/
          retention-days: 7

  style:
    name: Source hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Every source file carries an SPDX identifier
        run: |
          missing=0
          for f in src/*.cpp src/*.h CMakeLists.txt scripts/*.sh; do
            if ! grep -q "SPDX-License-Identifier: GPL-3.0-or-later" "$f"; then
              echo "missing SPDX identifier: $f"
              missing=1
            fi
          done
          exit "$missing"
